apply plugin: 'com.android.application'

android {
    compileSdkVersion 31
    defaultConfig {
        applicationId "com.advance.advancesdkdemo"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        multiDexEnabled true    // true时，生成多个dex
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }

    //添加
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
repositories {
    flatDir {
        dirs 'libs'
    }
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //圆形头像库的aar文件
    implementation fileTree(include: ['circleimageview-2.2.0.aar'], dir: 'libs')

//   一些公共库引用
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'
    implementation 'androidx.multidex:multidex:2.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    //引入Advance SDK --------start--------


//----------------引入方式1：在线依赖，适合直接使用得开发者
//1.1  必须引入部分： 首先引入聚合库，排除不需要的adapter库，此部分引入不包含广告aar文件，aar需单独引入。

    //SDK版本号
    def advanceVersion = '5.2.6.0'
    //必须引入，策略核心库
    implementation "com.github.bayescom.Android_AdvanceSDK:core:${advanceVersion}"
    //必须引入，基础库+Mercury广告变现sdk
    implementation "com.github.bayescom.Android_AdvanceSDK:mry:${advanceVersion}"
    implementation "io.github.bayescom:mercury-sdk:4.7.1"
    //可选引入
    implementation "com.github.bayescom.Android_AdvanceSDK:sigmob:${advanceVersion}"


//1.2  可选引入部分，引入各个广告ADN得aar
    implementation fileTree(dir: 'libs', include: ["*.aar"])


//----------------引入方式1 end ----------------------------------------------------------------


    //引入Advance SDK --------end--------
//glide 图片加载
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'

    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'


    //优量汇广告引用
    api "com.qq.e.union:union:4.671.1541"


}
